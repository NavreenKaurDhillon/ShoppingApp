name: Android Unit Test CI

# 1. When should this run?
on:
  push:
    branches: [ "*" ] # Runs when you push to these branches
  pull_request:
    branches: [ "*" ] # Runs when you open a PR

jobs:
  test:
    runs-on: ubuntu-latest # Uses a Linux machine in the cloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Downloads your code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew # Fixing that permission error automatically!

      - name: Run Unit Tests
        run: ./gradlew test # The command you just ran!