name: Android Unit Test CI

# 1. When should this run?
on:
#  push:
#    branches: [ "*" ] # Runs when you push to these branches
#  pull_request:
#    branches: [ "*" ] # Runs when you open a PR

jobs:
  # --- CI JOB ---
  test:
    runs-on: ubuntu-latest # Uses a Linux machine in the cloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Downloads your code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew # Fixing that permission error automatically!

      - name: Run Unit Tests
        run: ./gradlew test # The command you just ran!

    # --- CD JOB ---
  deploy:
    runs-on: ubuntu-latest
    needs: test # CRITICAL: Only runs if 'test' job passes
    if: github.ref == 'refs/heads/xml_setup_unit_testing' # Only deploy when pushing to main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testers_group
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
